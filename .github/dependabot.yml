version: 2
updates:
  - package-ecosystem: npm # pnpm 워크스페이스 루트
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # major는 취약점과 무관한 한 백로그로 계획해서 수동으로 올린다 (IMPROVEMENT_PLAN 3-3)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Expo SDK가 버전을 정하므로 수동 관리 (루트 pnpm overrides로도 고정)
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-navigation/*'
      # 프레임워크 major는 수동
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
