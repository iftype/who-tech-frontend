name: Mutation Test

# 뮤테이션 테스트는 느려서(약 10분) PR마다 돌리지 않고 매주 + 수동 실행한다. 점수 70% 미만이면 실패
on:
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stryker (web)
        run: pnpm --filter @who-tech/web test:mutation

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-web
          path: apps/web/reports/mutation
          retention-days: 14
