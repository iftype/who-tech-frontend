name: Release Please

# main에 push될 때마다 릴리즈 PR(버전·CHANGELOG)을 만들거나 갱신하고, 그 PR이 머지되면 태그·GitHub Release를 만든다
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN으로 만든 PR에는 CI가 자동 트리거되지 않아 필수 체크가 비어 있다.
      # workflow_dispatch는 GITHUB_TOKEN으로도 실행되고, 결과가 커밋 SHA에 붙어 필수 체크를 채운다
      - name: Run CI on release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(echo "$PR_JSON" | jq -r '.headBranchName')"
          echo "Dispatching web-ci.yml on $branch"
          gh workflow run web-ci.yml --ref "$branch" -R "${{ github.repository }}"

      # GitHub은 GITHUB_TOKEN이 만든 PR의 pull_request 실행을 승인 대기(action_required)로 두고,
      # 이 대기 상태가 머지를 막는다 → 릴리즈 PR 커밋의 대기 실행을 승인한다
      - name: Approve pending CI runs on release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          number="$(echo "$PR_JSON" | jq -r '.number')"
          sha="$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)"
          ids=""
          for _ in $(seq 1 12); do
            ids="$(gh api "repos/$REPO/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id')"
            [ -n "$ids" ] && break
            sleep 5
          done
          for id in $ids; do
            gh api -X POST "repos/$REPO/actions/runs/$id/approve" && echo "approved run $id" || echo "::warning::run $id 승인 실패 (수동 승인 필요)"
          done
